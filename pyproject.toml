[ build-system ]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[ project ]
name = "sparc-benchmark"
version = "1.0.0"
authors = [
  { name = "T. Abram", email = "tabram@gth-physics.org" },
]
description = "Zero-Free-Parameter SPARC 175-Galaxy Benchmark Suite via Relativistic Boundary Stress Tensor (gtx)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
]


[ project.urls ]
"Homepage" = "https://github.com/CoderQuan2/sparc-benchmark"
"Manuscript" = "https://drive.google.com/file/d/1uQq0Kpxm5bqcexNKyBnUEDLKmP_L8izd/view"
